project:
  type: website
  output-dir: _site
  render:            # which files become website pages
    - "*.qmd"
    - "*.ipynb"
    - "!CONTRIBUTING.md"

website:
  title: "US Agriculture & Climate Data Map"
  favicon: images/logo.svg
  navbar:
    logo: images/logo.svg
    logo-alt: "Site logo"
    left:
      - href: index.qmd
        text: Map
      - href: sources.qmd
        text: Data sources
      - href: blog/index.qmd
        text: Blog
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: https://github.com/ostojanovic/capstone-cohort10
        aria-label: Source code on GitHub
  page-footer:
    left: "Climatebase Fellowship, Cohort 10 capstone"
    right: "For education and research only · Content [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)"

format:
  html:
    theme: [cosmo, styles/theme.scss]

execute:
  freeze: auto   # only re-run code when a page's source changes
  echo: false    # hide code on the website by default; posts can set `echo: true`
  warning: false
