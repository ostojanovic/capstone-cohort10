[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone"
version = "0.1.0"
description = "Climatebase Fellowship Cohort 10 capstone: US public datasets on agriculture, droughts and El Niño"
requires-python = ">=3.11"
dependencies = ["folium", "ipython"]

[tool.setuptools.packages.find]
where = ["src"]
