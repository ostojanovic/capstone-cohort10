# Build the Quarto website and publish it on GitHub Pages.
#
# Runs on every push to `main` (the published version) and manually from the Actions tab.
# Pull requests to `develop` only build the site, to catch problems before they are merged. Nothing is published.
# Pages are NOT re-executed here: Quarto uses the results committed in `_freeze/`.
# So after changing Python code, re-render the affected pages locally and commit `_freeze/`.
#
# One-time setup (repository admin): Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Publish website

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:        # if two pushes come in quickly, only build the latest (each branch / pull request separately)
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38   # same as the team uses locally (`quarto --version`); update together

      # Pages name the Jupyter kernel `capstone-cohort10`, so Quarto needs a kernel with that name,
      # even though it doesn't run any code. Our own libraries are deliberately not installed:
      # if `_freeze/` is out of date, Quarto tries to run the page and the build fails instead of
      # publishing an incomplete site.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Register Jupyter kernel
        run: |
          pip install jupyter
          python -m ipykernel install --user --name capstone-cohort10

      - name: Render website
        run: quarto render

      # Fails if a page shows a Python error or a map/chart as text, or a notebook has no outputs
      - name: Check website
        run: python .github/check_site.py

      # Everything below only runs when publishing, not for pull requests
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy to GitHub Pages
      id-token: write   # to verify the deployment comes from this repository
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
